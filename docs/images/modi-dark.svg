    <text x="640" y="136" text-anchor="middle" font-size="14" fill="#9AA4C0">Sequenz läuft</text>
    <text x="640" y="244" text-anchor="middle" font-size="14" fill="#9AA4C0">N.I.N.A. weg</text>
    <text x="640" y="185" text-anchor="middle" font-size="13" font-weight="700" letter-spacing="1.6" fill="#FF5A5F">AUTO</text>
