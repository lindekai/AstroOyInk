<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
  <title id="t">Die zwei Modi von AstroOyInk</title>
  <desc id="d">WEATHER-Modus und SESSION-Modus, automatischer Wechsel je nachdem, ob N.I.N.A. erreichbar ist und eine Sequenz läuft.</desc>
  <rect width="1280" height="360" rx="24" fill="#F4F5F8"/>
  <g font-family="ui-sans-serif, -apple-system, 'SF Pro Display', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <rect x="80" y="60" width="440" height="240" rx="18" fill="#FFFFFF" stroke="#D3D8E4" stroke-width="1.5"/>
    <rect x="112" y="84" width="56" height="5" rx="2.5" fill="#111522"/>
    <text x="112" y="126" font-size="26" font-weight="800" fill="#111522">☁  WEATHER</text>
    <text x="112" y="164" font-size="18" fill="#4E586F">Open-Meteo + 7Timer! Seeing</text>
    <text x="112" y="194" font-size="18" fill="#4E586F">Mond nach Meeus, Nacht-Bewertung</text>
    <text x="112" y="224" font-size="18" fill="#4E586F">6-Tage-Vorschau, Mondhöhe je Stunde</text>
    <text x="112" y="276" font-size="14" font-weight="700" letter-spacing="1.6" fill="#111522">STANDARD · DEEP-SLEEP · 1×/STUNDE</text>
    <rect x="760" y="60" width="440" height="240" rx="18" fill="#FFFFFF" stroke="#D3D8E4" stroke-width="1.5"/>
    <rect x="792" y="84" width="56" height="5" rx="2.5" fill="#C8102E"/>
    <text x="792" y="126" font-size="26" font-weight="800" fill="#111522">🔭  SESSION</text>
    <text x="792" y="164" font-size="18" fill="#4E586F">Target, Sub-Fortschritt, Status</text>
    <text x="792" y="194" font-size="18" fill="#4E586F">Kamera, HFR, Guiding-RMS</text>
    <text x="792" y="224" font-size="18" fill="#4E586F">Mount, Pier-Seite, Meridian-Flip</text>
    <text x="792" y="276" font-size="14" font-weight="700" letter-spacing="1.6" fill="#C8102E">N.I.N.A. AKTIV · DEEP-SLEEP · 5 MIN</text>
    <g stroke="#4E586F" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
